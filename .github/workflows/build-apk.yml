name: Build Android APK
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create mock google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "0000", "project_id": "mock" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:0000:android:0000",
                "android_client_info": { "package_name": "com.unsmoke.app" }
              },
              "api_key": [{ "current_key": "mock" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnSmoke-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
